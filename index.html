<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanjay Balaji - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Watermark */
        body::before {
            content: "SANJAY BALAJI";
            position: absolute;
            font-size: 90px;
            font-weight: bold;
            color: rgba(0, 0, 0, 0.05);
            transform: rotate(-30deg);
            white-space: nowrap;
            z-index: 0;
            pointer-events: none;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .remember {
            margin-bottom: 20px;
        }

        .remember label {
            display: inline;
            font-weight: normal;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            text-decoration: none;
            color: #0066cc;
        }

        .watermark-name {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #aaa;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Login</h1>
        <p class="subtitle">Welcome to my website</p>

        <form>
            <label for="username">Username</label>
            <input type="text"
                   id="username"
                   placeholder="Enter your username"
                   required>

            <label for="password">Password</label>
            <input type="password"
                   id="password"
                   placeholder="Enter your password"
                   required>

            <div class="remember">
                <input type="checkbox" id="remember">
                <label for="remember">Remember Me</label>
            </div>

            <button type="submit">Login</button>
        </form>

        <div class="links">
            <p><a href="#">Forgot Password?</a></p>
            <br>
            <p>Don't have an account?
                <a href="#">Register</a>
            </p>
        </div>

        <div class="watermark-name">
            SANJAY BALAJI
        </div>

    </div>

</body>
</html>
